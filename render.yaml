# Render blueprint. The API service must not load Transformer models.
# Give the worker more than 512 MB RAM; the free instance is too small for them.
databases:
  - name: geopolitics-db
    plan: basic-256mb

services:
  - type: web
    name: geopolitics-api
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: geopolitics-db
          property: connectionString
      - key: ENABLE_SCHEDULER
        value: "false"
      - key: PYTHON_VERSION
        value: "3.11.11"
      - key: ADMIN_API_KEY
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: NEWSAPI_KEY
        sync: false
      - key: GNEWS_API_KEY
        sync: false
      - key: GUARDIAN_API_KEY
        sync: false

  - type: worker
    name: geopolitics-scheduler
    runtime: python
    plan: standard
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.scheduler.run_scheduler
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: geopolitics-db
          property: connectionString
      - key: ENABLE_SCHEDULER
        value: "true"
      - key: PYTHON_VERSION
        value: "3.11.11"
      - key: NEWSAPI_KEY
        sync: false
      - key: GNEWS_API_KEY
        sync: false
      - key: GUARDIAN_API_KEY
        sync: false
      - key: SUMMARY_MODEL
        value: sshleifer/distilbart-cnn-12-6
      - key: SENTIMENT_MODEL
        value: cardiffnlp/twitter-roberta-base-sentiment-latest
      - key: NER_MODEL
        value: dslim/bert-base-NER
